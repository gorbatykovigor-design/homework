<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        ol {
            background: white;
            width: 600px;
            margin: auto;
            padding: 30px 50px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: left;
            font-size: 20px;
            color: #333;
        }

        li {
            margin: 15px 0;
        }

        /* Кнопки навігації */
        .navigation {
            position: fixed;
            left: 20px;
            bottom: 20px;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .navigation a {
            width: 60px;
            height: 60px;

            border-radius: 50%;
            background: #333;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
            font-size: 11px;
            font-weight: bold;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

            transition: 0.2s;
        }

        .navigation a:hover {
            transform: scale(1.1);
            background: #555;
        }
    </style>
</head>

<body>

    <ol>
        Моє портфоліо робіт:

        <li>Телеграм бот для продажу скінів в грі CS2</li>
        <li>Телеграм бот для продажу зірок та подарунків</li>
        <li>Телеграм бот для продажу валюти всередині гри</li>
        <li>Сайт ресторану</li>
        <li>Сайт для усунення поламок</li>
    </ol>


    <!-- Навігація -->
    <div class="navigation">

        <a href="{% url 'main' %}">
            Головна
        </a>

        <a href="{% url 'my_able' %}">
            Навички
        </a>

    </div>

</body>
</html>
